name: Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static Unity project checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Run independent static checks
        run: |
          set -o pipefail
          mkdir -p TestResults
          ./Scripts/run-static-checks.sh 2>&1 | tee TestResults/StaticChecks.log

      - name: Publish static diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-check-diagnostics
          path: TestResults/StaticChecks.log
          if-no-files-found: error
